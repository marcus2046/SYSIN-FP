name: sysin-fp-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: sysin-fp/jenkins-ci:latest
    container_name: jenkins-ci
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins-data: