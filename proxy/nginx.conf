server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Reverse-proxy basics, inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # The proxy's own health check (used by Docker; not forwarded anywhere)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Per-module health endpoints, reachable through the single entry point
    # (used by the Jenkins smoke test and by the demo)
    location = /api/items/health   { proxy_pass http://items-api:3000/health; }
    location = /api/pokemon/health { proxy_pass http://pokemon-api:3001/health; }

    # More specific prefix first (nginx picks the longest matching prefix anyway)
    # /api/pokemon/pikachu  ->  pokemon-api:  /pokemon/pikachu
    location /api/pokemon/ { proxy_pass http://pokemon-api:3001/pokemon/; }

    # Everything else under /api/  ->  items-api, prefix stripped
    # /api/items  ->  items-api: /items
    location /api/         { proxy_pass http://items-api:3000/; }

    # Everything that isn't /api/ -> static frontend
    location /             { proxy_pass http://frontend:8080; }
}