server {
    listen 8080;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/items/health   { proxy_pass http://items-api:3000/health; }
    location = /api/pokemon/health { proxy_pass http://pokemon-api:3001/health; }

    location /api/pokemon/ { proxy_pass http://pokemon-api:3001/pokemon/; }
    location /api/         { proxy_pass http://items-api:3000/; }

    location /             { proxy_pass http://frontend:8080; }
}