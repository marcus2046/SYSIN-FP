services:
  proxy:
    build: ./proxy
    image: myapp/proxy:${TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - api
    networks:
      - app-net

  frontend:
    build: ./frontend
    image: myapp/frontend:${TAG:-latest}
    networks:
      - app-net

  api:
    build:
      context: ./api
      target: production
    image: myapp/api:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
